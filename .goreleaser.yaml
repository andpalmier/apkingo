version: 2
before:
  hooks:
    - go mod tidy
builds:
  # -s -w drop the symbol table and DWARF data, which the binary does not need
  # and which made every published archive larger than it had to be.
  #
  # The -X paths must match the variable names in internal/version. The linker
  # discards a -X naming a symbol that does not exist without reporting it, so
  # a typo here would leave every release reporting "dev". CI runs the built
  # binary and checks.
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    main: ./cmd/apkingo
    ldflags:
      - -s -w
      - -X github.com/andpalmier/apkingo/internal/version.Version={{.Version}}
      - -X github.com/andpalmier/apkingo/internal/version.Commit={{.ShortCommit}}
      - -X github.com/andpalmier/apkingo/internal/version.Date={{.Date}}
  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    main: ./cmd/apkingo
    ldflags:
      - -s -w
      - -X github.com/andpalmier/apkingo/internal/version.Version={{.Version}}
      - -X github.com/andpalmier/apkingo/internal/version.Commit={{.ShortCommit}}
      - -X github.com/andpalmier/apkingo/internal/version.Date={{.Date}}

archives:
  - id: nix
    ids:
      - default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: windows
    ids:
      - windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

homebrew_casks:
  - name: apkingo
    repository:
      owner: andpalmier
      name: homebrew-tap
    homepage: "https://github.com/andpalmier/apkingo"
    description: "Tool to extract info from APK files"
    license: "Apache-2.0"
    directory: Casks
    # Homebrew quarantines what a cask downloads, and these binaries are neither
    # signed nor notarized, so macOS refuses to run them with "apkingo is
    # damaged and cannot be opened". Formulae did not have this problem, so this
    # is required by the move to casks rather than optional.
    #
    # Clearing the quarantine attribute is a bypass: Apple may withdraw it, and
    # signing plus notarization is the durable answer. That needs an Apple
    # Developer account, so it is a separate decision.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/apkingo"]
          end

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# One "docker buildx build" across both platforms, pushed as a single
# multi-platform image. A client pulling the tag gets the manifest for its own
# architecture.
dockers_v2:
  - id: apkingo
    images:
      - "ghcr.io/andpalmier/apkingo"
    tags:
      # No "v" prefix, so the image tag matches the release version the way
      # every other tool in the tap publishes it.
      - "{{ .Version }}"
      # "latest" must never move onto a prerelease. An empty tag is ignored.
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Tool to extract info from APK files"
      org.opencontainers.image.version: "{{ .Version }}"
      # GitHub reads this label to attach the published package to the
      # repository, which is what puts the package under the repo's Packages
      # tab and lets its visibility be managed from there.
      org.opencontainers.image.source: "https://github.com/andpalmier/apkingo"
      org.opencontainers.image.licenses: "Apache-2.0"