version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    main: ./cmd/apkingo
  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    main: ./cmd/apkingo

archives:
  - id: nix
    ids:
      - default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: windows
    ids:
      - windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

homebrew_casks:
  - name: apkingo
    repository:
      owner: andpalmier
      name: homebrew-tap
    homepage: "https://github.com/andpalmier/apkingo"
    description: "Tool to extract info from APK files"
    license: "Apache-2.0"
    directory: Casks
    # Homebrew quarantines what a cask downloads, and these binaries are neither
    # signed nor notarized, so macOS refuses to run them with "apkingo is
    # damaged and cannot be opened". Formulae did not have this problem, so this
    # is required by the move to casks rather than optional.
    #
    # Clearing the quarantine attribute is a bypass: Apple may withdraw it, and
    # signing plus notarization is the durable answer. That needs an Apple
    # Developer account, so it is a separate decision.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/apkingo"]
          end

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dockers_v2:
  - images:
      - "ghcr.io/andpalmier/apkingo"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64